<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>購物清單</title>
<meta name="theme-color" content="#2E7D6B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 class="app-title">購物清單</h1>
    <button id="btn-tags" class="icon-btn" aria-label="標籤設定">
      <span class="icon-btn-emoji">🏷️</span>
      <span class="icon-btn-label">編輯標籤</span>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn is-active" data-tab="daily">日常採購</button>
    <button class="tab-btn" data-tab="store">大賣場採購</button>
  </nav>

  <main id="panel-daily" class="tab-panel is-active"></main>
  <main id="panel-store" class="tab-panel"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
